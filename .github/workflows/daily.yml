name: daily-clips

on:
  schedule:
    - cron: "17 6 * * *"   # каждый день в 09:17 по Москве (06:17 UTC)
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write            # чтобы сохранить state.json (какие отрезки уже использованы)

concurrency:
  group: daily-clips
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Restore downloaded sources
        uses: actions/cache@v4
        with:
          path: work/sources
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Run pipeline
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKENS: ${{ secrets.YT_TOKENS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python pipeline.py

      - name: Save state
        if: always()
        run: |
          git config user.name "clipfarm-bot"
          git config user.email "clipfarm-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
